[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[project]
name = "torchsaver"
description = "Extract activations from PyTorch model layers and stream them to local HDF5 files"
readme = "README.md"
requires-python = ">=3.14.7"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Raj Magesh Gauthaman", email = "torchsaver@raj-magesh.org" },
]
keywords = [
    "model activations",
    "feature extraction",
    "PyTorch",
    "local HDF5 disk cache",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
urls = { repository = "https://codeberg.org/raj-magesh/torchsaver" }
dependencies = [
    "platformdirs",
    "numpy",
    "tqdm",
    "xarray",
    "netCDF4",
    "Pillow",
    "polycache @ git+https://codeberg.org/raj-magesh/polycache.git@main",
    "torch",
    "torchvision",
]
version = "0.1.0"

[dependency-groups]
dev = ["ruff", "pytest", "sphinx"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
polycache = { path = "../polycache", editable = true }
